<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vigía</title>
<meta name="description" content="Radares, rutas y gasolineras">
<meta name="theme-color" content="#070B16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigía">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
</head>
<body>

<!-- Iconos -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E0C6"/><stop offset="1" stop-color="#2F6EFF"/></linearGradient>
    <linearGradient id="g-road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00E0C6"/><stop offset="1" stop-color="#2F6EFF"/></linearGradient>
  </defs>
  <symbol id="logo" viewBox="0 0 100 100">
    <path d="M16 100 L46.5 47 L53.5 47 L84 100 L70 100 L50 55.5 L30 100 Z" fill="url(#g-road)"/>
    <path d="M49.4 63 h1.2 l.5 4 h-2.2z M49 72 h2 l.6 6 h-3.2z M48.5 84 h3 l.8 9 h-4.6z" fill="#00E0C6"/>
    <circle cx="50" cy="43" r="4.6" fill="#fff"/>
    <g fill="none" stroke="#00E0C6" stroke-width="4" stroke-linecap="round">
      <path d="M41 37.4 A11 11 0 0 1 59 37.4"/>
      <path d="M35.2 31.3 A19 19 0 0 1 64.8 31.3" opacity=".75"/>
      <path d="M29.5 25.3 A27 27 0 0 1 70.5 25.3" opacity=".5"/>
    </g>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></g></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></g></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><path d="M12 2.5 20 21l-8-4-8 4z" fill="currentColor"/></symbol>
  <symbol id="i-fuel" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3.5" width="10" height="17" rx="2"/><path d="M4 11h10M14 8l3.5 2.5V17a1.5 1.5 0 0 0 3 0V8.5L18 6"/></g></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 22 20H2z" fill="currentColor"/><path d="M12 9.5v5M12 17.2v.3" stroke="#070B16" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></g></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M4.5 7.5 8 4l3.5 3.5M16 20V4M19.5 16.5 16 20l-3.5-3.5"/></g></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.6 7-12a7 7 0 0 0-14 0c0 5.4 7 12 7 12z" fill="currentColor"/><circle cx="12" cy="10" r="2.6" fill="#070B16"/></symbol>
  <symbol id="i-me" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4.5h-4.5"/></g></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 9 11 5 20 4c0 9-4 15-13 15M5 19l7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-ruler" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M7 8v3.5M11 8v2.5M15 8v3.5M19 8v2.5"/></g></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/></symbol>
  <symbol id="i-euro" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M17.5 6.5a7 7 0 1 0 0 11M4 10.5h9M4 14h9"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 21 8l-9 5-9-5z"/><path d="M3 12.5l9 5 9-5M3 16.5l9 5 9-5" opacity=".6"/></g></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z M9 4v13.5M15 6.5V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><rect x="2.5" y="7" width="15" height="10.5" rx="2.5" fill="currentColor"/><path d="M17.5 10.5 21.5 8v8.5l-4-2.5z" fill="currentColor"/><circle cx="10" cy="12.2" r="2.8" fill="#070B16"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 11l1.8-4.2A2 2 0 0 1 8.6 5.5h6.8a2 2 0 0 1 1.8 1.3L19 11h.5a1.5 1.5 0 0 1 1.5 1.5V17h-2v1.5a1 1 0 0 1-2 0V17H7v1.5a1 1 0 0 1-2 0V17H3v-4.5A1.5 1.5 0 0 1 4.5 11z" fill="currentColor"/><circle cx="7" cy="14" r="1.3" fill="#070B16"/><circle cx="17" cy="14" r="1.3" fill="#070B16"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5 20 5.5v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z" fill="currentColor"/><path d="M12 7v9" stroke="#070B16" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-light" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="3.5" fill="currentColor"/><circle cx="12" cy="7" r="1.8" fill="#070B16"/><circle cx="12" cy="12" r="1.8" fill="#070B16"/><circle cx="12" cy="17" r="1.8" fill="#070B16"/></symbol>
  <symbol id="i-lanes" viewBox="0 0 24 24"><path d="M6 21 9 3M18 21 15 3M12 4v3M12 10.5v3M12 17v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-thumb-up" viewBox="0 0 24 24"><path d="M3 10.5h3.5V21H3zM8.5 21h8.2a2 2 0 0 0 2-1.6l1.3-6.5a2 2 0 0 0-2-2.4H14l.8-4a1.8 1.8 0 0 0-3.3-1.3L8.5 10.5z" fill="currentColor"/></symbol>
  <symbol id="i-thumb-down" viewBox="0 0 24 24"><g transform="rotate(180 12 12)"><path d="M3 10.5h3.5V21H3zM8.5 21h8.2a2 2 0 0 0 2-1.6l1.3-6.5a2 2 0 0 0-2-2.4H14l.8-4a1.8 1.8 0 0 0-3.3-1.3L8.5 10.5z" fill="currentColor"/></g></symbol>
  <!-- Maniobras -->
  <symbol id="m-straight" viewBox="0 0 48 48"><path d="M24 42V10M13 20 24 9l11 11" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="m-left" viewBox="0 0 48 48"><path d="M32 42V24a6 6 0 0 0-6-6H11M19 9l-9 9 9 9" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="m-right" viewBox="0 0 48 48"><path d="M16 42V24a6 6 0 0 1 6-6h15M29 9l9 9-9 9" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="m-slight-left" viewBox="0 0 48 48"><path d="M28 42V27L14 13M14 26V13h13" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="m-slight-right" viewBox="0 0 48 48"><path d="M20 42V27l14-14M21 13h13v13" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="m-uturn" viewBox="0 0 48 48"><path d="M16 42V18a8 8 0 0 1 16 0v14M24 26l8 8 8-8" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="m-roundabout" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 44v-9"/><circle cx="24" cy="24" r="9"/><path d="M30.5 17.5 37 11M30 11h7v7"/></g></symbol>
  <symbol id="m-flag" viewBox="0 0 48 48"><path d="M12 44V6" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M14 7h24l-5 8 5 8H14z" fill="currentColor"/></symbol>
  <symbol id="m-reroute" viewBox="0 0 48 48"><path d="M38 24a14 14 0 1 1-4.1-9.9M38 8v8h-8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div id="map" aria-label="Mapa"></div>

<!-- Capa de interfaz sobre el mapa -->
<div id="hud">
  <div class="hud-top">
    <div id="topbar" class="row">
      <div class="search glass">
        <button id="searchBtn" class="search-btn" type="button">
          <svg class="logo-sm"><use href="#logo"/></svg>
          <span id="searchText" class="placeholder">¿A dónde vamos?</span>
        </button>
        <button id="clearBtn" class="icon-plain" type="button" aria-label="Quitar destino" hidden><svg><use href="#i-x"/></svg></button>
        <svg id="searchIcon" class="icon-muted"><use href="#i-search"/></svg>
      </div>
      <button id="settingsBtn" class="fab glass" type="button" aria-label="Ajustes"><svg><use href="#i-sliders"/></svg></button>
    </div>
    <div id="chips" class="chips" role="tablist" aria-label="Qué mostrar en el mapa"></div>

    <div id="maneuver" class="maneuver glass" hidden>
      <div class="maneuver-icon"><svg id="maneuverIcon"><use href="#m-straight"/></svg></div>
      <div class="maneuver-text">
        <div id="maneuverDist" class="maneuver-dist">—</div>
        <div id="maneuverInstr" class="maneuver-instr"></div>
      </div>
      <div id="thenBox" class="then" hidden>Luego <svg id="thenIcon"><use href="#m-straight"/></svg></div>
    </div>
    <div id="lanes" class="lanes glass" hidden aria-label="Carriles"></div>

    <div id="banner" class="banner glass" hidden>
      <div class="banner-icon"><span class="pulse"></span><svg id="bannerIcon"><use href="#i-camera"/></svg></div>
      <div class="banner-text">
        <div class="banner-kind"><span id="bannerKind">Radar fijo</span><span id="bannerStatus" class="status-pill" hidden></span></div>
        <div id="bannerDist" class="banner-dist">500 m</div>
      </div>
      <div id="bannerLimit" class="limit" hidden>80</div>
    </div>
    <div id="notice" class="notice glass" hidden></div>
  </div>

  <div class="hud-bottom">
    <div class="controls">
      <div id="speed" class="speed glass" aria-label="Velocidad">
        <svg viewBox="0 0 100 100" class="speed-ring">
          <circle cx="50" cy="50" r="42" class="ring-bg" pathLength="100"/>
          <circle id="speedArc" cx="50" cy="50" r="42" class="ring-fg" pathLength="100"/>
        </svg>
        <div class="speed-num"><span id="speedVal">0</span><small>km/h</small></div>
        <div id="speedLimit" class="limit limit-sm" hidden>80</div>
      </div>
      <button id="cheapPill" class="cheap glass" type="button" hidden></button>
      <div class="fab-col">
        <button id="recenterBtn" class="fab glass" type="button" aria-label="Centrar en mi posición"><svg><use href="#i-locate"/></svg></button>
        <button id="gasBtn" class="fab glass fuel" type="button" aria-label="Gasolineras"><svg><use href="#i-fuel"/></svg></button>
        <button id="voiceBtn" class="fab glass" type="button" aria-label="Voz" hidden><svg><use href="#i-vol"/></svg></button>
        <button id="reportBtn" class="fab fab-report" type="button" aria-label="Avisar de un radar"><svg><use href="#i-alert"/></svg></button>
      </div>
    </div>
    <div id="navbar" class="navbar glass" hidden>
      <div class="stat"><b id="etaVal" class="grad">--:--</b><small>llegada</small></div>
      <span class="divider"></span>
      <div class="stat"><b id="remTime">–</b><small>restante</small></div>
      <span class="divider"></span>
      <div class="stat"><b id="remDist">–</b><small>distancia</small></div>
      <button id="endBtn" class="end-btn" type="button" aria-label="Terminar ruta"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="arrived" class="navbar glass" hidden>
      <svg class="arrived-icon"><use href="#m-flag"/></svg>
      <div class="stat grow"><b>Has llegado</b><small id="arrivedName"></small></div>
      <button id="arrivedBtn" class="btn-grad small" type="button">Terminar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast glass" hidden></div>

<!-- Hoja inferior (buscador, gasolineras, fichas, ajustes, avisar) -->
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" aria-modal="true" role="dialog" hidden>
  <div class="grabber"></div>
  <header class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button id="sheetClose" class="icon-plain" type="button" aria-label="Cerrar"><svg><use href="#i-x"/></svg></button>
  </header>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<!-- Comparador de rutas (deja ver el mapa) -->
<section id="planner" class="sheet planner" hidden>
  <div class="grabber" id="plannerGrab"></div>
  <div id="plannerBody" class="sheet-body"></div>
</section>

<!-- Inicio -->
<div id="start" class="start">
  <div class="start-inner">
    <svg class="logo-xl"><use href="#logo"/></svg>
    <h1>Vigía</h1>
    <p class="tagline">Radares · Rutas · Gasolineras</p>
    <button id="startBtn" class="btn-grad" type="button">Empezar</button>
    <p id="startHint" class="fine">Pulsa para activar el GPS, la voz y los avisos sonoros.</p>
    <p id="installHint" class="fine install" hidden>Para tenerla como app: botón <b>Compartir</b> de Safari → <b>Añadir a pantalla de inicio</b>.</p>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
